# vc-config: Vibe Coding workspace configuration
#
# [repos] is the workspace's repo registry: work and bot are paths
# relative to this file's directory (absolute allowed, discouraged).
# The entry that resolves to this config's own directory names the
# side: work = "." makes this the work repo.

[repos]
work = "."
bot = ".claude"

# Optional keys: uncomment and edit to override the built-in
# default. `vc-x1 config` prints this list from the binary.

[bot-session]
# bot-session.items: Default bot-session item set (comma-separated)
#   used by: bot-session --<item> / --no-<item> / --all / --none
#   default: "headers,user,assistant,tool,summary"
#   reference: https://github.com/winksaville/vc-x1/blob/HEAD/vc-config.md#bot-sessionitems
# items = "headers,user,assistant,tool,summary"

# bot-session.result-lines: Default --result-lines: max lines shown per
#   tool result (0 = unlimited)
#   used by: bot-session --result-lines
#   default: 10
#   reference: https://github.com/winksaville/vc-x1/blob/HEAD/vc-config.md#bot-sessionresult-lines
# result-lines = 10

# bot-session.col-width: Default --col-width: first-column width in the
#   --fields / --unknown / --per-line views
#   used by: bot-session --col-width
#   default: 68
#   reference: https://github.com/winksaville/vc-x1/blob/HEAD/vc-config.md#bot-sessioncol-width
# col-width = 68

